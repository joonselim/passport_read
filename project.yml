name: PassportReader
options:
  bundleIdPrefix: com.joonselim
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"

packages:
  NFCPassportReader:
    url: https://github.com/AndyQ/NFCPassportReader
    from: "2.3.3"

targets:
  PassportReader:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    dependencies:
      - package: NFCPassportReader
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Passport Reader
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NFCReaderUsageDescription: Uses NFC to read passport data from the ePassport chip.
        NSCameraUsageDescription: Scans the MRZ on the passport's photo page to unlock the NFC chip.
        NSLocalNetworkUsageDescription: Sends passport data to the verification server on your local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        com.apple.developer.nfc.readersession.iso7816.select-identifiers:
          - A0000002471001
          - A0000002472001
    entitlements:
      path: Sources/PassportReader.entitlements
      properties:
        com.apple.developer.nfc.readersession.formats:
          - TAG
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joonselim.PassportReader
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: C7N9686FJW
        ENABLE_USER_SCRIPT_SANDBOXING: YES
